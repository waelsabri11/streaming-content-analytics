resources:
  jobs:
    sca_netflix:
      name: sca-netflix-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: netflix_build_and_score
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["netflix", "--catalog", "${var.catalog}", "--raw-root", "/Volumes/${var.catalog}/bronze/raw", "--results-dir", "/Volumes/${var.catalog}/gold/results"]

    sca_lakehouse:
      name: sca-lakehouse-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
              - databricks-feature-engineering
      tasks:
        - task_key: netflix
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["netflix", "--catalog", "${var.catalog}", "--raw-root", "/Volumes/${var.catalog}/bronze/raw", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: lakehouse
          depends_on: [{task_key: netflix}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["lakehouse", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: export_app_data
          depends_on: [{task_key: lakehouse}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["export-app-data", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]

    sca_twitch:
      name: sca-twitch-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-bronze", "--catalog", "${var.catalog}", "--raw-root", "/Volumes/${var.catalog}/bronze/raw", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: silver
          depends_on: [{task_key: bronze}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-silver", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: features
          depends_on: [{task_key: silver}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-features", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: segments
          depends_on: [{task_key: features}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-segments", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: lifecurves
          depends_on: [{task_key: silver}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-lifecurves", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: churn
          depends_on: [{task_key: features}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-churn", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: abtest
          depends_on: [{task_key: features}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-abtest", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: streaming_replay
          depends_on: [{task_key: silver}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["twitch-streaming", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: optimize_demo
          depends_on: [{task_key: silver}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["optimize-demo", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]

    sca_benchmark:
      name: sca-benchmark-${bundle.target}
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: p1
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["benchmark", "--pct", "1", "--repeats", "3", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: p10
          depends_on: [{task_key: p1}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["benchmark", "--pct", "10", "--repeats", "3", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: p50
          depends_on: [{task_key: p10}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["benchmark", "--pct", "50", "--repeats", "3", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
        - task_key: p100
          depends_on: [{task_key: p50}]
          environment_key: default
          spark_python_task:
            python_file: ../jobs/run.py
            parameters: ["benchmark", "--pct", "100", "--repeats", "3", "--catalog", "${var.catalog}", "--results-dir", "/Volumes/${var.catalog}/gold/results"]
