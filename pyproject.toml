[project]
name = "streaming-content-analytics"
version = "0.1.0"
description = "Databricks lakehouse on Twitch viewing logs and Netflix engagement reports: segmentation, life curves, performance score, value index"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==4.0.1",
  "delta-spark==4.0.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "shap>=0.46",
  "openpyxl>=3.1",
  "requests>=2.32",
  "matplotlib>=3.9",
  "mlflow-skinny>=2.16,<3",
]

[dependency-groups]
dev = ["pyyaml>=6", "pytest>=8", "ruff>=0.6", "streamlit>=1.38", "plotly>=5.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streaming_content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: needs a local Spark session"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E731", "E402", "B905"]
