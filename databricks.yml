# Databricks Asset Bundle: Lakeflow pipeline + job for the streaming-content lakehouse.
# Validate:  databricks bundle validate -t dev      Deploy:  databricks bundle deploy -t dev
bundle:
  name: streaming-content-analytics

variables:
  catalog:
    description: Unity Catalog catalog that holds the bronze/silver/gold schemas
    default: workspace   # Free Edition default catalog

artifacts:
  sca_wheel:
    type: whl
    build: uv build --wheel
    path: .

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-0d8ed9ac-0478.cloud.databricks.com   # workspace URL, not a secret
